manifestVersion: 1
id: localinfra-health
category: developer
name: Container Health
version: "1.0.0"
tagline: See at a glance whether the containers you run are healthy
icon: https://raw.githubusercontent.com/LKhoe/LocalInfra/main/localinfra-health/icon.svg
description: >-
  Home-screen widgets and a status page for the containers you deploy yourself
  (LocalInfra and your projects). Apps managed by umbrelOS are left out, and new
  projects show up automatically, one row per Docker Compose project, problems
  first.


  To hide a one-off container, give it the label localinfra.health.hide=true.
  The app only reads the container list from Docker; it never changes anything.
releaseNotes: ""
developer: LKhoe
website: https://github.com/LKhoe/LocalInfra
repo: https://github.com/LKhoe/LocalInfra
support: https://github.com/LKhoe/LocalInfra/issues
port: 3790
gallery: []
path: ""
submitter: LKhoe
widgets:
  - id: "projects"
    type: "list-emoji"
    refresh: "30s"
    endpoint: "server:3000/widgets/projects"
    link: ""
    example:
      type: "list-emoji"
      link: ""
      count: "4/5"
      items:
        - emoji: "⚠️"
          text: "my-app 0/1"
        - emoji: "✅"
          text: "localinfra 3/3"
        - emoji: "✅"
          text: "yarg-aggregator 1/1"
  - id: "summary"
    type: "four-stats"
    refresh: "30s"
    endpoint: "server:3000/widgets/summary"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Healthy"
          text: "4"
        - title: "Starting"
          text: "0"
        - title: "Unhealthy"
          text: "1"
        - title: "Stopped"
          text: "0"
