manifestVersion: 1
id: localinfra-health
category: developer
name: Container Health
version: "1.2.4"
tagline: See at a glance whether the containers you run are healthy
icon: https://raw.githubusercontent.com/LKhoe/LocalInfra/main/localinfra-health/icon.svg
description: >-
  Home-screen widgets and a status page for the containers you deploy yourself
  (LocalInfra and your projects). Apps managed by umbrelOS are left out, and new
  projects show up automatically, one row per Docker Compose project, problems
  first.


  The status page also maps which LocalInfra resources (Postgres, Redis, S3, the
  Cloudflare tunnel) each container uses, shows each container's memory, and has
  step-by-step guides for publishing an app on Cloudflare and adding Google sign-in.


  To hide a one-off container, give it the label localinfra.health.hide=true.
  The app only reads from Docker (the container list and memory readings); it never
  changes anything.
releaseNotes: >-
  The resource map shows each app's own icon (its favicon), linking to its public address.
developer: LKhoe
website: https://github.com/LKhoe/LocalInfra
repo: https://github.com/LKhoe/LocalInfra
support: https://github.com/LKhoe/LocalInfra/issues
port: 3790
gallery: []
path: ""
submitter: LKhoe
widgets:
  - id: "projects"
    type: "list-emoji"
    refresh: "30s"
    endpoint: "server:3000/widgets/projects"
    link: ""
    example:
      type: "list-emoji"
      link: ""
      count: "4/5"
      items:
        - emoji: "⚠️"
          text: "my-app 0/1"
        - emoji: "✅"
          text: "localinfra 3/3"
        - emoji: "✅"
          text: "yarg-aggregator 1/1"
  - id: "summary"
    type: "three-stats"
    refresh: "30s"
    endpoint: "server:3000/widgets/summary"
    link: ""
    example:
      type: "three-stats"
      link: ""
      items:
        - icon: "box"
          subtext: "Containers"
          text: "4/5"
        - icon: "stack-2"
          subtext: "Projects"
          text: "2/3"
        - icon: "alert-triangle"
          subtext: "Issues"
          text: "1"
  - id: "gauges"
    type: "two-stats-with-guage"
    refresh: "30s"
    endpoint: "server:3000/widgets/gauges"
    link: ""
    example:
      type: "two-stats-with-guage"
      link: ""
      items:
        - title: "Containers"
          text: "4/5"
          progress: 0.8
        - title: "Projects"
          text: "2/3"
          progress: 0.67
