manifestVersion: 1
id: localinfra-health
category: developer
name: Container Health
version: "1.3.0"
tagline: See at a glance whether the containers you run are healthy
icon: https://raw.githubusercontent.com/LKhoe/LocalInfra/main/localinfra-health/icon.svg
description: >-
  Home-screen widgets and a status page for the containers you deploy yourself
  (LocalInfra and your projects). Apps managed by umbrelOS are left out, and new
  projects show up automatically, one row per Docker Compose project, problems
  first.


  The status page also maps which LocalInfra resources (Postgres, Redis, S3, the
  LLM gateway, the Cloudflare tunnel) each app uses, shows each container's
  memory and version, what the nightly backup holds and whether its last run
  succeeded, says when a newer cloudflared is out, lists what each app
  integrates with (Google, Alexa, Spotify, YouTube Music...), and has
  step-by-step guides for publishing an app on Cloudflare, adding Google sign-in
  and connecting an Alexa skill with Echo Show screens.


  To hide a one-off container, give it the label localinfra.health.hide=true.
  The app only reads from Docker (the container list, memory readings, each
  app's package.json version and the backup's status files); it never changes
  anything.
releaseNotes: >-
  New Backups section: what the Postgres and Home Assistant backups hold and how the last run
  went (needs the LocalInfra backup image from the same release). A banner says when a newer
  cloudflared is out for the tunnel. Integrations show the services' real logos, and the
  resource map no longer lists localinfra-backup as an app.
developer: LKhoe
website: https://github.com/LKhoe/LocalInfra
repo: https://github.com/LKhoe/LocalInfra
support: https://github.com/LKhoe/LocalInfra/issues
port: 3790
gallery: []
path: ""
submitter: LKhoe
widgets:
  - id: "projects"
    type: "list-emoji"
    refresh: "30s"
    endpoint: "server:3000/widgets/projects"
    link: ""
    example:
      type: "list-emoji"
      link: ""
      count: "4/5"
      items:
        - emoji: "⚠️"
          text: "my-app 0/1"
        - emoji: "✅"
          text: "localinfra 3/3"
        - emoji: "✅"
          text: "yarg-aggregator 1/1"
  - id: "summary"
    type: "three-stats"
    refresh: "30s"
    endpoint: "server:3000/widgets/summary"
    link: ""
    example:
      type: "three-stats"
      link: ""
      items:
        - icon: "box"
          subtext: "Containers"
          text: "4/5"
        - icon: "stack-2"
          subtext: "Projects"
          text: "2/3"
        - icon: "alert-triangle"
          subtext: "Issues"
          text: "1"
  - id: "gauges"
    type: "two-stats-with-guage"
    refresh: "30s"
    endpoint: "server:3000/widgets/gauges"
    link: ""
    example:
      type: "two-stats-with-guage"
      link: ""
      items:
        - title: "Containers"
          text: "4/5"
          progress: 0.8
        - title: "Projects"
          text: "2/3"
          progress: 0.67
