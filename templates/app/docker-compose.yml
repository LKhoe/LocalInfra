# <APP> — app only. Postgres / Redis / S3 come from LocalInfra (start it first).
# Template: LocalInfra/templates/app/docker-compose.yml — see LocalInfra/DEPLOYING-APPS.md.
#
# Replace "myapp" everywhere with the app's name (kebab-case, e.g. my-recipes), pick a free host
# port from the port table in DEPLOYING-APPS.md, and delete the blocks the app doesn't use.
#
# Contract (deploy.sh checks the first three):
#   - exactly one service; container_name == service name == image name, image tag ":latest"
#   - a healthcheck on /api/health that also checks the app's dependencies
#   - external networks only; no bind mounts (compose runs on the Mac, the files would be
#     looked up on the Pi); no data volumes (data goes to Postgres / S3)
services:
  myapp:
    container_name: myapp
    image: myapp:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* are baked into the client bundle at BUILD time
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      # LAN access (http://umbrel.local:<PORT>). The tunnel doesn't use it. Unique per app.
      - "${PORT:-30XX}:3000"
    environment:
      # ---- LocalInfra: written into .env by LocalInfra/scripts/provision-app.sh
      - DATABASE_URL=${DATABASE_URL:?set DATABASE_URL in .env}
      - POSTGRES_HOST=${POSTGRES_HOST:-localinfra-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      # Redis (provision-app.sh without --no-redis): every key/channel must start with the prefix
      - REDIS_HOST=${REDIS_HOST:-localinfra-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_USERNAME=${REDIS_USERNAME:?set REDIS_USERNAME in .env}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - REDIS_KEY_PREFIX=${REDIS_KEY_PREFIX:?set REDIS_KEY_PREFIX in .env}
      # S3 (provision-app.sh --s3): path-style, region "garage", bucket private
      - S3_ENDPOINT=${S3_ENDPOINT:-http://localinfra-s3:3900}
      - S3_REGION=${S3_REGION:-garage}
      - S3_BUCKET=${S3_BUCKET:?set S3_BUCKET in .env}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      # ---- App
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - NODE_ENV=production
      - TZ=${TZ:-America/Sao_Paulo}
      # ... the app's own settings (auth secret, public URL, API keys), each as KEY=${KEY}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - localinfra_postgres
      - localinfra_redis
      - localinfra_s3
      # Public access through the umbrelOS Cloudflare Tunnel app: http://myapp:3000
      - umbrel_main_network
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Created by LocalInfra (start it first). Keep only the ones listed above.
  localinfra_postgres:
    external: true
  localinfra_redis:
    external: true
  localinfra_s3:
    external: true
  umbrel_main_network:
    external: true
