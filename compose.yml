# LocalInfra — shared data services for every project on the Pi.
#
#   postgres  → network "localinfra_postgres"  (one role + one database per project)
#   redis     → network "localinfra_redis"     (one ACL user per project, keys "<project>:*")
#   backup    → nightly pg_dump of every database + copy of Home Assistant's backup to the external drive
#   s3        → network "localinfra_s3"        (Garage; one bucket + one access key per project)
#   tunnel    → network "localinfra_tunnel"    (Cloudflare tunnel; reaches public apps by container name)
#   llm       → network "localinfra_llm"       (LLM gateway + local model; one key + paid-call limits per project)
#   metrics   → network "localinfra_metrics"   (anonymous usage metrics from the apps; one key per project)
#
# Projects join only the network(s) they need, as external networks.
# New project:   scripts/new-project.sh <name>
#
# No "./file" bind mounts on purpose: this stack can be deployed from the Mac with
# a Docker context (DOCKER_CONTEXT=umbrel docker compose up -d --build) and relative
# bind mounts would point at paths that only exist on the Mac.

name: localinfra

services:
  postgres:
    container_name: localinfra-postgres
    image: postgres:${PG_VERSION:-17}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: postgres
      TZ: ${TZ:-UTC}
    # Tuned for a Raspberry Pi 4 (8 GB) that also runs umbrelOS and its apps.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1GB}
      - -c
      - work_mem=${PG_WORK_MEM:-8MB}
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-100}
      - -c
      - random_page_cost=1.1
      - -c
      - log_min_duration_statement=1000
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Loopback only by default: reach it from the Pi itself or via an SSH tunnel.
      - "${POSTGRES_PUBLISH:-127.0.0.1:5432}:5432"
    networks:
      - postgres
    shm_size: 128mb
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${PG_MEMORY_LIMIT:-1G}
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    container_name: localinfra-redis
    build:
      context: ./redis
      args:
        REDIS_VERSION: ${REDIS_VERSION:-7.4}
    image: localinfra-redis:${REDIS_VERSION:-7.4}
    restart: unless-stopped
    environment:
      REDIS_ADMIN_PASSWORD: ${REDIS_ADMIN_PASSWORD:?set REDIS_ADMIN_PASSWORD in .env}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-256mb}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PUBLISH:-127.0.0.1:6379}:6379"
    networks:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_ADMIN_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-384M}
    logging: *logging

  backup:
    container_name: localinfra-backup
    build:
      context: ./backup
      args:
        PG_VERSION: ${PG_VERSION:-17}
    image: localinfra-backup:${PG_VERSION:-17}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_SUPERUSER:-postgres}
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      TZ: ${TZ:-UTC}
      BACKUP_CRON: ${BACKUP_CRON:-0 4 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
      BACKUP_ON_START: ${BACKUP_ON_START:-false}
      HA_BACKUP_MAX_AGE_HOURS: ${HA_BACKUP_MAX_AGE_HOURS:-26}
    volumes:
      # Absolute path ON THE PI (on the external drive). Must contain the marker
      # file ".localinfra-backup-target" — see README.
      - ${BACKUP_DIR:?set BACKUP_DIR in .env}:/backups
      # Home Assistant's own backups folder (it makes an encrypted .tar daily at 03:30).
      # Read-only, so LocalInfra can never change or delete Home Assistant's backups.
      - ${HA_BACKUP_SOURCE:-/home/umbrel/umbrel/app-data/home-assistant/data/backups}:/homeassistant:ro
    networks:
      - postgres
    # Unhealthy when no Postgres backup succeeded in the last 26h (or ever), so a missed
    # backup shows up in Container Health like any other broken container. Same for the
    # Home Assistant copy, except during the first 26h after the container starts
    # (/run/backup.env is written at start), so a fresh deploy isn't flagged before
    # its first nightly run.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          find /backups/postgres/last_success -mmin -1560 2>/dev/null | grep -q . &&
          find /backups/homeassistant/last_success /run/backup.env -mmin -1560 2>/dev/null | grep -q .
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 1m
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *logging

  s3:
    container_name: localinfra-s3
    build:
      context: ./s3
      args:
        GARAGE_VERSION: ${GARAGE_VERSION:-v2.4.1}
    image: localinfra-s3:${GARAGE_VERSION:-v2.4.1}
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${S3_RPC_SECRET:?set S3_RPC_SECRET in .env}
      GARAGE_ADMIN_TOKEN: ${S3_ADMIN_TOKEN:?set S3_ADMIN_TOKEN in .env}
      TZ: ${TZ:-UTC}
    volumes:
      # Absolute path ON THE PI (on the external RAID drive). Must contain the marker file
      # ".localinfra-s3-target", or the container refuses to start — see README.
      - ${S3_DATA_DIR:?set S3_DATA_DIR in .env}:/data
    ports:
      # S3 API, loopback only by default: reach it from the Pi itself or via an SSH tunnel.
      # The RPC (3901) and admin (3903) ports are never published.
      - "${S3_PUBLISH:-127.0.0.1:3900}:3900"
    networks:
      - s3
    healthcheck:
      # /health answers 200 only once the single-node layout is up and the node can serve requests
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3903/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${S3_MEMORY_LIMIT:-256M}
    logging: *logging

  llm:
    # One container, two processes (llm/start.sh): the gateway apps call on :4000, and
    # Ollama with the local model on 127.0.0.1:11434, which only the gateway can reach.
    container_name: localinfra-llm
    build:
      context: ./llm
      args:
        NODE_VERSION: ${LLM_NODE_VERSION:-24}
        OLLAMA_VERSION: ${OLLAMA_VERSION:-0.35.1}
    image: localinfra-llm:${OLLAMA_VERSION:-0.35.1}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      # Only the gateway holds the OpenRouter key; apps get their own llm_... key
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Tiers: comma-separated, tried in order. simple may list free models only.
      LLM_SIMPLE_MODELS: ${LLM_SIMPLE_MODELS:-google/gemma-4-31b-it:free,openrouter/free}
      LLM_MEDIUM_MODELS: ${LLM_MEDIUM_MODELS:-anthropic/claude-haiku-5.5,openai/gpt-6-luna}
      LLM_HARD_MODELS: ${LLM_HARD_MODELS:-anthropic/claude-sonnet-5.5,openai/gpt-6.1-sol}
      # Per-app limits on paid calls (medium + hard); change one app with llm-admin limits
      LLM_DEFAULT_MONTHLY_USD: ${LLM_DEFAULT_MONTHLY_USD:-2}
      LLM_DEFAULT_DAILY_PAID_CALLS: ${LLM_DEFAULT_DAILY_PAID_CALLS:-200}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-8192}
      # Local model (the simple tier's fallback), downloaded into /data/models on first start
      LLM_LOCAL_MODEL: ${LLM_LOCAL_MODEL:-gemma3:1b}
      # One request at a time and one model in memory: the Pi has 4 cores and shares its RAM
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      # Unloaded after this long without a call (frees ~1 GB)
      OLLAMA_KEEP_ALIVE: ${LLM_LOCAL_KEEP_ALIVE:-30m}
      OLLAMA_CONTEXT_LENGTH: ${LLM_LOCAL_CONTEXT:-8192}
    volumes:
      # Apps (key hashes, limits), the call log and the local model. Not in the nightly
      # backup: if it's lost, re-issue the keys with new-project.sh <app> --llm --rotate.
      - llm_data:/data
    tmpfs:
      - /tmp
    ports:
      # Gateway only, loopback only: for an app run with npm run dev, or through an SSH tunnel
      - "${LLM_PUBLISH:-127.0.0.1:4000}:4000"
    networks:
      - llm
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # The gateway answers. The local model may still be downloading: /health says so.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          # gemma3:1b with an 8k context needs about 1.2 GB while loaded; the gateway ~60 MB
          memory: ${LLM_MEMORY_LIMIT:-2G}
    logging: *logging

  metrics:
    # Light, anonymous usage metrics (Web Vitals, route views, errors) sent by each app's own
    # /api/metrics route. No published port and no tunnel route: only apps on localinfra_metrics
    # reach it. Container Health shows /run/metrics/summary.json (read through Docker).
    container_name: localinfra-metrics
    build:
      context: ./metrics
      args:
        NODE_VERSION: ${METRICS_NODE_VERSION:-24}
    image: localinfra-metrics:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      # Its own role + database (scripts/new-project.sh localinfra_metrics --no-redis), never the superuser
      METRICS_DATABASE_URL: ${METRICS_DATABASE_URL:-}
      METRICS_KEEP_HOURLY_DAYS: ${METRICS_KEEP_HOURLY_DAYS:-7}
      METRICS_KEEP_DAILY_DAYS: ${METRICS_KEEP_DAILY_DAYS:-180}
      METRICS_KEEP_ERROR_DAYS: ${METRICS_KEEP_ERROR_DAYS:-90}
    volumes:
      # Only the summary Container Health reads (rebuilt from Postgres at start). A volume, not a
      # tmpfs: Docker's archive endpoint, which Container Health reads it with, can't see a tmpfs.
      - metrics_summary:/run/metrics
    networks:
      - metrics
      - postgres
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${METRICS_MEMORY_LIMIT:-128M}
    logging: *logging

  tunnel:
    container_name: localinfra-tunnel
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-2026.10.4}
    restart: unless-stopped
    # Routes (hostname → http://<container>:<port>) live in Cloudflare Zero Trust, not here.
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      # Read by cloudflared from the environment, so it doesn't show in the command line
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
      TUNNEL_METRICS: 127.0.0.1:20241
    networks:
      - tunnel
    healthcheck:
      # The image has no shell: cloudflared asks its own /ready endpoint (200 once a connection is up)
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${TUNNEL_MEMORY_LIMIT:-128M}
    logging: *logging

volumes:
  postgres_data:
  redis_data:
  llm_data:
  metrics_summary:

networks:
  postgres:
    name: localinfra_postgres
  redis:
    name: localinfra_redis
  s3:
    name: localinfra_s3
  tunnel:
    name: localinfra_tunnel
  llm:
    name: localinfra_llm
  metrics:
    name: localinfra_metrics
